# backend talks to evil's real MCP server and tern-llm's real /ask over the
# network (Tailscale in production) -- neither is a service here, same
# reasoning as tern-llm's own docker-compose.yml not bundling Ollama.
#
# The browser only talks to the frontend: it calls /api/*, which the frontend
# server (frontend/server.ts) proxies to the backend. One origin, so the UI also
# works when served over HTTPS. VITE_API_BASE_URL (a BUILD-time value, see
# frontend/Dockerfile) stays /api unless you deliberately point the bundle at a
# backend directly; changing it means `docker compose build frontend`.
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      EVIL_MCP_URL: ${EVIL_MCP_URL:-http://127.0.0.1:8765/mcp}
      TERN_LLM_URL: ${TERN_LLM_URL:-http://127.0.0.1:8000}
      EVIL_UPLOAD_URL: ${EVIL_UPLOAD_URL:-http://127.0.0.1:8766}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "8081:8081"
    depends_on:
      - backend
    restart: unless-stopped
